name: Daily And st TW Price Scraper

concurrency:
  group: update-prices-data
  cancel-in-progress: false
  
on:
  schedule:
    - cron: '0 4 * * *' # UTC 04:00 = 台灣時間 12:00
  workflow_dispatch:    # 支援手動點擊立即執行

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main # 排隊等待後仍取得最新版，而不是觸發當下的舊版

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated prices
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update prices $(date +'%Y-%m-%d')"
            # data/ 是程式整份重新產生的資料；與別的執行同時更新時以本次結果為準，失敗則重試
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "推送失敗" >&2
            exit 1
          fi
