<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>And st TW 搜尋｜商品歷史價格追蹤</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-white text-gray-800 min-h-screen">
  <!-- 頂部導覽列（仿 UQ 搜尋風格） -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div class="flex items-center gap-4">
        <a href="?" class="flex items-center gap-2 shrink-0">
          <span class="w-7 h-7 rounded bg-red-600 text-white font-bold text-xs flex items-center justify-center">ST</span>
          <span class="text-base font-bold tracking-tight text-gray-900">And st 搜尋</span>
        </a>
        <div class="relative flex-1 md:w-80">
          <input
            id="searchInput"
            type="text"
            placeholder="輸入關鍵字或 6 碼貨號 (如 659900)..."
            class="w-full pl-3.5 pr-9 py-1.5 text-sm border border-gray-300 rounded focus:outline-none focus:border-gray-500"
          />
          <span class="absolute right-2.5 top-2 text-gray-400 text-xs">&#128269;</span>
        </div>
      </div>

      <div class="flex items-center justify-between md:justify-end gap-4 text-sm text-gray-600">
        <div class="flex items-center gap-3">
          <button data-mode="all" class="filter-tab font-semibold text-red-600 border-b-2 border-red-600 pb-0.5">全部</button>
          <button data-mode="sale" class="filter-tab hover:text-gray-900 pb-0.5">特價中</button>
          <button data-mode="lowest" class="filter-tab hover:text-gray-900 pb-0.5">歷史低價</button>
          <button data-mode="new" class="filter-tab hover:text-gray-900 pb-0.5">近期新品</button>
        </div>
        <span id="metaInfo" class="text-xs text-gray-400 hidden sm:inline">載入中...</span>
      </div>
    </div>
  </header>

  <!-- 商品詳情與歷史價格主區塊（點選商品後顯示，完全對齊截圖版面） -->
  <section id="detailSection" class="hidden border-b border-gray-200 bg-white">
    <!-- 分頁導覽列 -->
    <div class="border-b border-gray-200">
      <div class="max-w-6xl mx-auto px-4 flex items-center justify-between overflow-x-auto">
        <div class="flex items-center gap-6 text-sm whitespace-nowrap">
          <span class="py-3 font-bold text-gray-900 border-b-2 border-red-600">歷史價格</span>
          <a id="tabTwLink" href="#" target="_blank" rel="noopener" class="py-3 text-gray-600 hover:text-gray-900">台灣官網商品頁 &nearr;</a>
          <a id="tabJpLink" href="#" target="_blank" rel="noopener" class="py-3 text-gray-600 hover:text-red-600 font-medium">日本版資訊 (and ST 同款) &nearr;</a>
        </div>
        <button id="closeDetailBtn" class="text-xs text-gray-500 hover:text-gray-900 py-2 px-3 border border-gray-200 rounded">
          返回商品列表 &times;
        </button>
      </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-6">
      <h2 class="text-lg font-bold text-gray-800 pb-3 border-b border-gray-200 mb-6">歷史價格</h2>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <!-- 左側：歷史高價 / 歷史低價 雙卡片（含大箭頭浮水印） -->
        <div class="lg:col-span-4 grid grid-cols-2 lg:grid-cols-1 gap-4">
          <!-- 歷史高價卡片 -->
          <div class="relative overflow-hidden bg-white border border-gray-200 rounded-lg p-6 text-center shadow-2xs">
            <div class="relative z-10">
              <div id="cardMaxPrice" class="text-4xl sm:text-5xl font-normal text-gray-600 tracking-tight">-</div>
              <div class="text-sm text-gray-600 mt-2">歷史高價</div>
            </div>
            <!-- 向上灰箭頭浮水印 -->
            <svg class="w-28 h-28 text-gray-100 absolute -right-2 -bottom-3 pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3l8 8h-5v10H9V11H4l8-8z"/>
            </svg>
          </div>

          <!-- 歷史低價卡片 -->
          <div class="relative overflow-hidden bg-white border border-gray-200 rounded-lg p-6 text-center shadow-2xs">
            <div class="relative z-10">
              <div id="cardMinPrice" class="text-4xl sm:text-5xl font-normal text-gray-600 tracking-tight">-</div>
              <div class="text-sm text-gray-600 mt-2">歷史低價</div>
            </div>
            <!-- 向下灰箭頭浮水印 -->
            <svg class="w-28 h-28 text-gray-100 absolute -right-2 -bottom-3 pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21l-8-8h5V3h6v10h5l-8 8z"/>
            </svg>
          </div>
        </div>

        <!-- 右側：商品標題資訊列 + 階梯折線圖 -->
        <div class="lg:col-span-8">
          <div class="flex flex-wrap items-center gap-3 mb-4">
            <img id="detailImg" src="" alt="" class="w-11 h-11 object-cover rounded border border-gray-200 bg-gray-50 shrink-0" />
            <div class="flex flex-wrap items-baseline gap-x-2.5 gap-y-1">
              <h3 id="detailTitle" class="text-base sm:text-lg font-bold text-gray-900"></h3>
              <span id="detailMeta" class="text-xs sm:text-sm text-gray-400"></span>
              <button id="copySkuBtn" type="button" class="text-xs px-2 py-0.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded">
                複製貨號
              </button>
            </div>
          </div>

          <div class="border border-gray-200 rounded-lg p-4 bg-white">
            <div class="h-72 sm:h-80 w-full">
              <canvas id="priceChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 商品網格列表 -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    <div id="emptyState" class="hidden text-center py-16 text-gray-400 text-sm">
      找不到符合條件的商品，請嘗試其他貨號或關鍵字。
    </div>
    <div class="mt-8 text-center">
      <button id="loadMoreBtn" class="hidden px-6 py-2 text-sm bg-white border border-gray-300 rounded hover:bg-gray-50 text-gray-700">
        載入更多商品
      </button>
    </div>
  </main>

  <script>
    let allItems = [];
    let filteredItems = [];
    let visibleCount = 40;
    let currentMode = 'all';
    let latestUpdateDate = '';
    let priceChart = null;
    let currentSku = '';

    const escapeHtml = (str) =>
      String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    async function init() {
      try {
        const res = await fetch('data/index.json?t=' + Date.now());
        if (!res.ok) throw new Error('尚未產生資料');
        const data = await res.json();
        allItems = data.items || [];
        latestUpdateDate = data.updated_at || new Date().toISOString().slice(0, 10);
        document.getElementById('metaInfo').textContent = `更新：${latestUpdateDate}（${data.count} 件）`;
        applyFilter();

        const params = new URLSearchParams(window.location.search);
        const querySku = params.get('q');
        if (querySku) {
          document.getElementById('searchInput').value = querySku;
          applyFilter();
          if (allItems.some((i) => i.sku === querySku.trim())) {
            openDetail(querySku.trim());
          }
        }
      } catch (err) {
        document.getElementById('metaInfo').textContent = '請先執行 Actions 爬蟲建立資料';
      }
    }

    function applyFilter() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const thirtyDaysAgo = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);

      filteredItems = allItems.filter((item) => {
        const matchQuery = !q || item.sku.includes(q) || item.title.toLowerCase().includes(q);
        if (!matchQuery) return false;
        if (currentMode === 'sale') return item.price < item.original_price;
        if (currentMode === 'lowest') return item.price <= item.min_price && item.price < item.original_price;
        if (currentMode === 'new') return (item.listed_date || '') >= thirtyDaysAgo;
        return true;
      });

      visibleCount = 40;
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('productGrid');
      const empty = document.getElementById('emptyState');
      const loadMoreBtn = document.getElementById('loadMoreBtn');

      if (filteredItems.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        loadMoreBtn.classList.add('hidden');
        return;
      }

      empty.classList.add('hidden');
      const slice = filteredItems.slice(0, visibleCount);
      grid.innerHTML = slice.map((item) => {
        const isSale = item.price < item.original_price;
        const isLowest = isSale && item.price <= item.min_price;
        return `
          <div onclick="openDetail('${item.sku}')" class="bg-white rounded border border-gray-200 overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col">
            <div class="relative aspect-[3/4] bg-gray-50">
              <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy" class="w-full h-full object-cover" />
              <span class="absolute top-2 left-2 px-1.5 py-0.5 text-[11px] font-mono bg-black/70 text-white rounded">${item.sku}</span>
              ${isLowest ? '<span class="absolute top-2 right-2 px-1.5 py-0.5 text-[11px] font-medium bg-red-600 text-white rounded">歷史低價</span>' : ''}
            </div>
            <div class="p-2.5 flex-1 flex flex-col justify-between">
              <div>
                <div class="text-[11px] text-gray-400 mb-0.5">上架：${item.listed_date || '-'}</div>
                <h3 class="text-xs sm:text-sm text-gray-800 line-clamp-2 leading-snug">${escapeHtml(item.title)}</h3>
              </div>
              <div class="mt-2 flex items-baseline gap-1.5">
                <span class="text-sm sm:text-base font-bold ${isSale ? 'text-red-600' : 'text-gray-900'}">NT$${item.price.toLocaleString()}</span>
                ${isSale ? `<span class="text-xs text-gray-400 line-through">NT$${item.original_price.toLocaleString()}</span>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      loadMoreBtn.classList.toggle('hidden', visibleCount >= filteredItems.length);
    }

    /**
     * 將稀疏的調價紀錄展開為「從上架日到今天的每日連續階梯時間軸」
     * 僅在起點、價格變動日與今天顯示橘黃圓點，完整復刻 uq.goodjack.tw 視覺效果
     */
    function buildContinuousSeries(history, endDateStr) {
      if (!history || history.length === 0) return { labels: [], prices: [], pointRadii: [] };

      const sorted = [...history].sort((a, b) => a.date.localeCompare(b.date));
      const startDate = new Date(sorted[0].date + 'T00:00:00');
      const endStr = endDateStr >= sorted[sorted.length - 1].date ? endDateStr : sorted[sorted.length - 1].date;
      const endDate = new Date(endStr + 'T00:00:00');

      const priceMap = new Map(sorted.map((h) => [h.date, h.price]));
      const labels = [];
      const prices = [];
      const pointRadii = [];

      let activePrice = sorted[0].price;
      let cursor = new Date(startDate);
      let idx = 0;

      while (cursor <= endDate) {
        const ymd = cursor.toISOString().slice(0, 10);
        const mmdd = ymd.slice(5).replace('-', '/'); // 格式化為 06/15
        let changed = false;

        if (priceMap.has(ymd)) {
          const newP = priceMap.get(ymd);
          if (idx === 0 || newP !== activePrice) {
            changed = true;
          }
          activePrice = newP;
        }

        labels.push(mmdd);
        prices.push(activePrice);
        pointRadii.push(changed ? 3.5 : 0);

        cursor.setDate(cursor.getDate() + 1);
        idx++;
      }

      // 確保最後一天（今天）也有一個結束圓點
      if (pointRadii.length > 0) {
        pointRadii[pointRadii.length - 1] = 3.5;
      }

      return { labels, prices, pointRadii };
    }

    async function openDetail(sku) {
      try {
        const res = await fetch(`data/items/${sku}.json?t=` + Date.now());
        const item = await res.json();
        currentSku = item.sku;

        document.getElementById('detailImg').src = item.image;
        document.getElementById('detailTitle').textContent = item.title;
        document.getElementById('detailMeta').textContent =
          `and ST 商品編號 ${item.sku} • 上架 ${item.listed_date || '-'} • NT$${item.current_price.toLocaleString()}`;
        document.getElementById('cardMaxPrice').textContent = item.max_price.toLocaleString();
        document.getElementById('cardMinPrice').textContent = item.min_price.toLocaleString();

        document.getElementById('tabTwLink').href = item.url;
        document.getElementById('tabJpLink').href =
          `https://www.dot-st.com/disp/CSfDispListPage_001.jsp?q=${encodeURIComponent(item.sku)}`;

        const detailSection = document.getElementById('detailSection');
        detailSection.classList.remove('hidden');
        detailSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

        const { labels, prices, pointRadii } = buildContinuousSeries(item.history, latestUpdateDate);
        const maxVal = Math.max(...prices, item.max_price);
        const suggestedMax = Math.ceil((maxVal + 50) / 100) * 100;

        const ctx = document.getElementById('priceChart').getContext('2d');
        if (priceChart) priceChart.destroy();
        priceChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: '售價 (NT$)',
              data: prices,
              borderColor: '#d9534f',
              borderWidth: 2,
              stepped: 'before',
              fill: false,
              pointRadius: pointRadii,
              pointHoverRadius: 5,
              pointBackgroundColor: '#f59e0b',
              pointBorderColor: '#d9534f',
              pointBorderWidth: 1.5,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  title: (items) => `日期：${items[0].label}`,
                  label: (ctx) => `價格：NT$ ${ctx.parsed.y.toLocaleString()}`
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: {
                  maxRotation: 45,
                  minRotation: 45,
                  autoSkip: true,
                  maxTicksLimit: 24,
                  font: { size: 11 },
                  color: '#6b7280'
                }
              },
              y: {
                beginAtZero: true,
                suggestedMax,
                grid: { color: '#f3f4f6' },
                ticks: {
                  font: { size: 11 },
                  color: '#6b7280'
                }
              }
            }
          }
        });
      } catch (e) {
        alert('無法讀取該商品的歷史紀錄');
      }
    }

    document.querySelectorAll('.filter-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach((b) => {
          b.classList.remove('font-semibold', 'text-red-600', 'border-b-2', 'border-red-600');
          b.classList.add('hover:text-gray-900');
        });
        btn.classList.add('font-semibold', 'text-red-600', 'border-b-2', 'border-red-600');
        currentMode = btn.dataset.mode;
        applyFilter();
      });
    });

    document.getElementById('copySkuBtn').addEventListener('click', async () => {
      if (!currentSku) return;
      await navigator.clipboard.writeText(currentSku);
      const btn = document.getElementById('copySkuBtn');
      btn.textContent = '已複製！';
      setTimeout(() => { btn.textContent = '複製貨號'; }, 1500);
    });

    document.getElementById('closeDetailBtn').addEventListener('click', () => {
      document.getElementById('detailSection').classList.add('hidden');
    });

    document.getElementById('searchInput').addEventListener('input', applyFilter);
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      visibleCount += 40;
      renderGrid();
    });

    init();
  </script>
</body>
</html>
